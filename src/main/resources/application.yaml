spring:
  application:
    name: task-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/task_manager}
    username: ${SPRING_DATASOURCE_USERNAME:task_manager}
    password: ${SPRING_DATASOURCE_PASSWORD:task_manager}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
      web:
          pageable:
              serialization-mode: via_dto

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-secret-key}
    expiration: ${JWT_EXPIRATION:86400000}
server:
  port: ${SERVER_PORT:8080}
